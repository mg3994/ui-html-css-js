<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ANTINNA</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
        }
        .role-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: var(--spacing-md);
        }
        .role-option {
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: center;
            transition: var(--transition-fast);
        }
        .role-option:hover {
            background: var(--glass-bg);
        }
        .role-option.active {
            border-color: var(--primary);
            background: rgba(0, 122, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card animate-fade-in-up">
            <div class="text-center mb-4">
                <a href="/" class="nav-logo flex-center">
                    <span class="text-gradient" style="font-size: 2rem;">ANTINNA</span>
                </a>
                <h2 class="mt-2">Create Account</h2>
                <p class="text-muted">Join the futuristic ecosystem today</p>
            </div>

            <form id="signup-form">
                <div class="input-group">
                    <label>Join as</label>
                    <div class="role-selector">
                        <div class="role-option active" data-role="customer">Customer</div>
                        <div class="role-option" data-role="mentor">Mentor</div>
                        <div class="role-option" data-role="vendor">Vendor</div>
                        <div class="role-option" data-role="provider">Service Provider</div>
                    </div>
                </div>

                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="input-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" class="input" placeholder="John" required>
                    </div>
                    <div class="input-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" class="input" placeholder="Doe" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="input" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted">Already have an account? <a href="login.html" style="color: var(--primary);">Log in</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="../../assets/js/modules/auth.js"></script>
</body>
</html>
