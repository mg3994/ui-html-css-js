<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ANTINNA</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card animate-fade-in-up">
            <div class="text-center mb-4">
                <a href="/" class="nav-logo flex-center">
                    <span class="text-gradient" style="font-size: 2rem;">ANTINNA</span>
                </a>
                <h2 class="mt-2">Welcome Back</h2>
                <p class="text-muted">Enter your credentials to access your account</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="input" placeholder="name@example.com" required>
                </div>
                <div class="input-group">
                    <div class="flex-between">
                        <label for="password">Password</label>
                        <a href="forgot-password.html" class="text-muted" style="font-size: var(--font-size-sm);">Forgot password?</a>
                    </div>
                    <input type="password" id="password" class="input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted">Don't have an account? <a href="signup.html" style="color: var(--primary);">Sign up</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="../../assets/js/modules/auth.js"></script>
</body>
</html>
