<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | ANTINNA</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
</head>
<body style="background: var(--color-bg); color: var(--text-main);">
    <header id="navbar-placeholder"></header>

    <main class="container p-4" style="margin-top: 100px;">
        <div class="flex-between mb-4 align-end">
            <div>
                <h1 class="text-gradient" style="font-size: 3rem;">Marketplace</h1>
                <p class="text-muted">Curated products from the world's finest vendors.</p>
            </div>
            <div class="flex" style="gap: 12px;">
                 <a href="cart.html" class="btn btn-glass">
                    Cart (<span id="cart-count">0</span>)
                </a>
            </div>
        </div>

        <div class="grid mb-4" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px;">
            <button class="btn btn-glass btn-sm active">All</button>
            <button class="btn btn-glass btn-sm">Fashion</button>
            <button class="btn btn-glass btn-sm">Electronics</button>
            <button class="btn btn-glass btn-sm">Grocery</button>
        </div>

        <div id="product-grid" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem;">
            <!-- Products -->
        </div>
    </main>

    <script type="module">
        import { Navbar } from '../../assets/js/components/Navbar.js';
        import { ProductCard } from '../../assets/js/components/ProductCard.js';
        import { MOCK_PRODUCTS } from '../../assets/js/modules/data.js';
        import { store } from '../../assets/js/modules/state.js';

        document.getElementById('navbar-placeholder').appendChild(Navbar());

        const grid = document.getElementById('product-grid');
        MOCK_PRODUCTS.forEach(p => grid.appendChild(ProductCard(p)));

        store.subscribe(state => {
            document.getElementById('cart-count').textContent = state.cart.reduce((s, i) => s + i.quantity, 0);
        });
    </script>
</body>
</html>
