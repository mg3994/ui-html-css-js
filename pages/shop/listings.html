<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | ANTINNA</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
</head>
<body>
    <header id="navbar-placeholder"></header>

    <main class="container p-4" style="margin-top: 80px;">
        <div class="flex-between mb-4">
            <div>
                <h1 class="text-gradient">Marketplace</h1>
                <p class="text-muted">Premium products from verified vendors.</p>
            </div>
            <a href="cart.html" class="btn btn-secondary">
                🛒 Cart <span id="cart-count" class="badge badge-primary ml-1">0</span>
            </a>
        </div>

        <div class="search-filters mb-4 flex" style="gap: 1rem;">
            <input type="text" class="input" placeholder="Search products..." style="flex: 1;">
            <select class="input">
                <option value="">Categories</option>
                <option value="electronics">Electronics</option>
                <option value="fashion">Fashion</option>
                <option value="digital">Digital</option>
            </select>
        </div>

        <div id="product-grid" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--spacing-xl);">
            <!-- Products rendered here -->
        </div>
    </main>

    <script type="module">
        import { Navbar } from '../../assets/js/components/Navbar.js';
        import { ProductCard } from '../../assets/js/components/ProductCard.js';
        import { store } from '../../assets/js/modules/state.js';

        document.getElementById('navbar-placeholder').appendChild(Navbar());

        const products = [
            { id: 101, name: 'Quantum Watch', category: 'Electronics', price: 299, image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500' },
            { id: 102, name: 'Cyberpunk Jacket', category: 'Fashion', price: 150, image: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500' },
            { id: 103, name: 'Neon Keyboard', category: 'Electronics', price: 120, image: 'https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=500' },
            { id: 104, name: 'AI Design Kit', category: 'Digital', price: 49, image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500' }
        ];

        const grid = document.getElementById('product-grid');
        products.forEach(p => grid.appendChild(ProductCard(p)));

        // Update cart count
        store.subscribe(state => {
            document.getElementById('cart-count').textContent = state.cart.reduce((sum, item) => sum + item.quantity, 0);
        });
    </script>
</body>
</html>
