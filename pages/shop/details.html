<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ANTINNA</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
    <style>
        .product-gallery { position: sticky; top: 100px; }
        .variant-section { margin-bottom: 2rem; }
        .variant-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 0.75rem; display: block; }
        .swatch-group, .chip-group { display: flex; gap: 12px; flex-wrap: wrap; }
    </style>
</head>
<body style="background: var(--color-bg); color: var(--text-main);">
    <header id="navbar-placeholder"></header>

    <main class="container p-4" style="margin-top: 100px;">
        <div id="product-root" class="grid" style="grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 4rem; align-items: start;">
            <!-- Loading state or injected content -->
        </div>
    </main>

    <script type="module">
        import { Navbar } from '../../assets/js/components/Navbar.js';
        import { MOCK_PRODUCTS } from '../../assets/js/modules/data.js';
        import { addToCart } from '../../assets/js/modules/cart.js';
        import { Toast } from '../../assets/js/components/Toast.js';
        import { Component } from '../../assets/js/utils/component.js';

        document.getElementById('navbar-placeholder').appendChild(Navbar());

        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');
        const product = MOCK_PRODUCTS.find(p => p.id === productId) || MOCK_PRODUCTS[0];

        let selectedVariants = {};

        // Initialize defaults
        if (product.variants) {
            if (product.variants.colors) selectedVariants.color = product.variants.colors[0].name;
            if (product.variants.sizes) selectedVariants.size = product.variants.sizes[0];
            if (product.variants.units) {
                selectedVariants.unit = product.variants.units[0].label;
                selectedVariants.priceModifier = product.variants.units[0].priceModifier;
            }
            if (product.variants.weights) {
                selectedVariants.weight = product.variants.weights[0].label;
                selectedVariants.priceModifier = product.variants.weights[0].priceModifier;
            }
        }

        const renderProduct = () => {
            const root = document.getElementById('product-root');
            root.innerHTML = '';

            // Left: Gallery
            const gallery = Component.create('div', { className: 'product-gallery' },
                Component.create('div', { className: 'glass-card', style: 'padding: 0; aspect-ratio: 1; border-radius: var(--radius-xl);' },
                    Component.create('img', {
                        src: product.image,
                        style: 'width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-xl);'
                    })
                )
            );

            // Right: Info
            const info = Component.create('div', { className: 'product-info' },
                Component.create('div', { className: 'mb-4' },
                    Component.create('span', { className: 'text-muted small', style: 'letter-spacing: 2px;' }, product.category.toUpperCase()),
                    Component.create('h1', { className: 'text-gradient', style: 'font-size: 3.5rem; line-height: 1.1; margin: 0.5rem 0;' }, product.name),
                    Component.create('div', { className: 'flex', style: 'gap: 1rem; align-items: center;' },
                        Component.create('span', { style: 'font-size: 2rem; font-weight: 600;' }, `$${(product.price + (selectedVariants.priceModifier || 0)).toFixed(2)}`),
                        Component.create('span', { className: 'badge badge-outline', style: 'color: var(--success);' }, 'In Stock')
                    )
                ),

                Component.create('p', { className: 'text-muted mb-4', style: 'font-size: 1.1rem; line-height: 1.6;' }, product.description),

                // Variants Section
                Component.create('div', { className: 'variants-container' },
                    // Colors
                    product.variants?.colors ? Component.create('div', { className: 'variant-section' },
                        Component.create('label', { className: 'variant-label' }, `Color: ${selectedVariants.color}`),
                        Component.create('div', { className: 'swatch-group' },
                            ...product.variants.colors.map(c => Component.create('div', {
                                className: `variant-swatch ${selectedVariants.color === c.name ? 'active' : ''}`,
                                style: `background: ${c.hex};`,
                                onClick: () => { selectedVariants.color = c.name; renderProduct(); }
                            }))
                        )
                    ) : null,

                    // Sizes
                    product.variants?.sizes ? Component.create('div', { className: 'variant-section' },
                        Component.create('label', { className: 'variant-label' }, `Size: ${selectedVariants.size}`),
                        Component.create('div', { className: 'chip-group' },
                            ...product.variants.sizes.map(s => Component.create('div', {
                                className: `variant-chip ${selectedVariants.size === s ? 'active' : ''}`,
                                onClick: () => { selectedVariants.size = s; renderProduct(); }
                            }, s))
                        )
                    ) : null,

                    // Units / Weights
                    (product.variants?.units || product.variants?.weights) ? Component.create('div', { className: 'variant-section' },
                        Component.create('label', { className: 'variant-label' }, `Select ${product.variants.units ? 'Volume' : 'Weight'}`),
                        Component.create('div', { className: 'chip-group' },
                            ...(product.variants.units || product.variants.weights).map(v => Component.create('div', {
                                className: `variant-chip ${ (selectedVariants.unit || selectedVariants.weight) === v.label ? 'active' : ''}`,
                                onClick: () => {
                                    if (product.variants.units) selectedVariants.unit = v.label;
                                    else selectedVariants.weight = v.label;
                                    selectedVariants.priceModifier = v.priceModifier;
                                    renderProduct();
                                }
                            }, v.label))
                        )
                    ) : null
                ),

                Component.create('div', { className: 'flex mt-4', style: 'gap: 1rem;' },
                    Component.create('button', {
                        className: 'btn btn-primary',
                        style: 'flex: 2; height: 60px; font-size: 1.1rem;',
                        onClick: () => {
                            addToCart(product, { ...selectedVariants });
                            Toast.show('Added to bag', 'success');
                        }
                    }, 'Add to Bag'),
                    Component.create('button', {
                        className: 'btn btn-glass',
                        style: 'flex: 1; height: 60px;'
                    }, '♡')
                ),

                Component.create('div', { className: 'mt-4 pt-4', style: 'border-top: 1px solid var(--color-glass-border);' },
                    Component.create('div', { className: 'flex-between mb-2 small text-muted' },
                        Component.create('span', {}, 'Vendor'),
                        Component.create('span', { style: 'color: var(--text-main);' }, product.vendor)
                    ),
                    Component.create('div', { className: 'flex-between small text-muted' },
                        Component.create('span', {}, 'Shipping'),
                        Component.create('span', { style: 'color: var(--text-main);' }, 'Free Express Shipping')
                    )
                )
            );

            root.appendChild(gallery);
            root.appendChild(info);
        };

        renderProduct();
    </script>
</body>
</html>
