<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ANTINNA</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
</head>
<body>
    <header id="navbar-placeholder"></header>

    <main class="container p-4" style="margin-top: 100px;">
        <div class="flex" style="gap: 4rem; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 300px;">
                <h1 class="text-gradient mb-2">Get in Touch</h1>
                <p class="text-muted mb-4">Have questions? Our team is here to help you navigate the Antinna ecosystem.</p>

                <div class="card mb-2" style="background: var(--glass-bg);">
                    <h4>Support</h4>
                    <p class="text-muted">support@antinna.io</p>
                </div>
                <div class="card mb-2" style="background: var(--glass-bg);">
                    <h4>Partnerships</h4>
                    <p class="text-muted">partners@antinna.io</p>
                </div>
                <div class="card" style="background: var(--glass-bg);">
                    <h4>Headquarters</h4>
                    <p class="text-muted">Silicon Valley, CA</p>
                </div>
            </div>

            <div style="flex: 1.5; min-width: 300px;">
                <form class="card" style="border: 1px solid var(--glass-border);">
                    <div class="mb-2">
                        <label class="text-muted small">Full Name</label>
                        <input type="text" class="input" placeholder="John Doe">
                    </div>
                    <div class="mb-2">
                        <label class="text-muted small">Email Address</label>
                        <input type="email" class="input" placeholder="john@example.com">
                    </div>
                    <div class="mb-2">
                        <label class="text-muted small">Subject</label>
                        <select class="input">
                            <option>General Inquiry</option>
                            <option>Technical Support</option>
                            <option>Billing</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="text-muted small">Message</label>
                        <textarea class="input" rows="5" placeholder="How can we help?"></textarea>
                    </div>
                    <button type="button" class="btn btn-primary w-full" onclick="alert('Message sent!')">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>

    <script type="module">
        import { Navbar } from '../../assets/js/components/Navbar.js';
        import { Footer } from '../../assets/js/components/Footer.js';
        document.getElementById('navbar-placeholder').appendChild(Navbar());
        document.getElementById('footer-placeholder').appendChild(Footer());
    </script>
</body>
</html>
