<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ANTINNA</title>
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <div id="sidebar-placeholder"></div>

        <main class="dashboard-main">
            <header class="flex-between mb-4">
                <h1>Platform Control</h1>
                <div class="flex-center" style="gap: 1rem;">
                    <span class="badge badge-primary">System Online</span>
                </div>
            </header>

            <div class="stats-card-grid">
                <div class="stat-card">
                    <p class="text-muted">Total Users</p>
                    <div class="stat-value">54,201</div>
                </div>
                <div class="stat-card">
                    <p class="text-muted">Total Revenue</p>
                    <div class="stat-value text-gradient">$1.2M</div>
                </div>
                <div class="stat-card">
                    <p class="text-muted">Pending Verifications</p>
                    <div class="stat-value">28</div>
                </div>
                <div class="stat-card">
                    <p class="text-muted">Active Sessions</p>
                    <div class="stat-value">4.5k</div>
                </div>
            </div>

            <section class="card mb-4">
                <h3>System Alerts</h3>
                <div class="mt-2">
                    <div class="p-1 mb-1" style="border-left: 4px solid var(--warning); background: rgba(255, 149, 0, 0.1);">
                        <strong>Pending Approval:</strong> 5 new mentors waiting for verification.
                    </div>
                    <div class="p-1" style="border-left: 4px solid var(--primary); background: rgba(0, 122, 255, 0.1);">
                        <strong>System Update:</strong> V2.0 rollout completed successfully.
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { DashboardSidebar } from '../../assets/js/components/DashboardSidebar.js';
        document.getElementById('sidebar-placeholder').appendChild(DashboardSidebar('admin.html'));
    </script>
</body>
</html>
